# ============================================
# APPLICATION
# ============================================
spring.application.name=${SPRING_APPLICATION_NAME:ResourceManagementSystem}

# ============================================
# DATABASE
# ============================================
spring.datasource.url=${RMS_DB_URL:jdbc:mysql://paves-intranet-db-dev.czsgackimf7p.ap-south-1.rds.amazonaws.com:3306/rms}
spring.datasource.username=${RMS_DB_USERNAME:admin_paves}
spring.datasource.password=${RMS_DB_PASSWORD:PavesAdmin}
spring.datasource.driver-class-name=${RMS_DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ============================================
# JPA
# ============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:4}

# ============================================
# SECURITY
# ============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://13.207.112.154/ums}
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin12345}

# ============================================
# SWAGGER
# ============================================
springdoc.swagger-ui.operations-sorter=${SWAGGER_OPERATIONS_SORTER:alpha}

# ============================================
# EXTERNAL AUTH
# ============================================
external.auth.url=${EXTERNAL_AUTH_URL:http://13.207.112.154/ums/auth/login}
external.auth.email=${EXTERNAL_AUTH_EMAIL:system.internal@pavestechnologies.com}
external.auth.password=${EXTERNAL_AUTH_PASSWORD:System@123}

# ============================================
# EXTERNAL API BASE URLS
# ============================================
external.api.leave.base-url=${LEAVE_API_BASE_URL:http://13.207.112.154/lms}

# ============================================
# CORS
# ============================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://d15j2ej3bear0q.cloudfront.net}

# ============================================
# EXTERNAL API ENDPOINTS
# ============================================
external.api.holiday.year-endpoint=${HOLIDAY_YEAR_ENDPOINT:/api/v1/holidays/year}
external.api.leave.year-endpoint=${LEAVE_YEAR_ENDPOINT:/api/v1/leaves/year}
external.api.leave.employee-endpoint=${LEAVE_EMPLOYEE_ENDPOINT:/api/v1/leaves/employee}

# ============================================
# TOKEN CONFIG
# ============================================
external.token.cache.minutes=${TOKEN_CACHE_MINUTES:5}
external.token.refresh.buffer.minutes=${TOKEN_REFRESH_BUFFER_MINUTES:1}

# ============================================
# REDIS
# ============================================
app.redis.enabled=${APP_REDIS_ENABLED:true}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:1}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2000}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.repositories.enabled=false

# ============================================
# CDC - PMS
# ============================================
cdc.enabled=${CDC_ENABLED:true}
cdc.inbox.poll-interval-ms=${CDC_INBOX_POLL_INTERVAL_MS:15000}

cdc.database.hostname=${CDC_DB_HOST}
cdc.database.port=${CDC_DB_PORT:3306}
cdc.database.user=${CDC_DB_USER}
cdc.database.password=${CDC_DB_PASSWORD}
cdc.database.name=${CDC_DB_NAME}

cdc.database.include.list=${CDC_DATABASE_INCLUDE_LIST}
cdc.table.include.list=${CDC_TABLE_INCLUDE_LIST}

cdc.server.name=${CDC_SERVER_NAME:pms_mysql}
cdc.topic.prefix=${CDC_TOPIC_PREFIX:pms}
cdc.snapshot.mode=${CDC_SNAPSHOT_MODE:when_needed}

# ============================================
# EOS CDC
# ============================================
eos.cdc.database.hostname=${EOS_CDC_DB_HOST}
eos.cdc.database.port=${EOS_CDC_DB_PORT:3306}
eos.cdc.database.user=${EOS_CDC_DB_USER}
eos.cdc.database.password=${EOS_CDC_DB_PASSWORD}
eos.cdc.database.name=${EOS_CDC_DB_NAME}

eos.cdc.database.include.list=${EOS_CDC_DATABASE_INCLUDE_LIST}
eos.cdc.table.include.list=${EOS_CDC_TABLE_INCLUDE_LIST}

eos.cdc.server.name=${EOS_CDC_SERVER_NAME:eos_mysql}
eos.cdc.topic.prefix=${EOS_CDC_TOPIC_PREFIX:eos}
eos.cdc.connector.name=${EOS_CDC_CONNECTOR_NAME:eos-cdc}
eos.cdc.snapshot.mode=${EOS_CDC_SNAPSHOT_MODE:when_needed}

# ============================================
# LIFECYCLE ORCHESTRATION
# ============================================
cdc.offer.waiting.max-days=${CDC_OFFER_WAITING_MAX_DAYS:45}
cdc.offer.waiting.retry-hours=${CDC_OFFER_WAITING_RETRY_HOURS:6}
cdc.offer.waiting.release-batch-size=${CDC_OFFER_WAITING_RELEASE_BATCH_SIZE:25}
cdc.offer.completed.reconciliation.max-minutes=${CDC_OFFER_COMPLETED_RECONCILIATION_MAX_MINUTES:60}

# ============================================
# LOGGING
# ============================================
logging.level.io.debezium=${LOGGING_LEVEL_IO_DEBEZIUM:WARN}
logging.level.org.apache.kafka.connect=${LOGGING_LEVEL_ORG_APACHE_KAFKA_CONNECT:WARN}
logging.level.com.cdc.throttling.ReplayThrottlingService=${LOGGING_LEVEL_REPLAY_THROTTLING_SERVICE:ERROR}

# Context Path
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/rms}