eos.cdc.database.port=22942
eos.cdc.database.user=avnadmin
eos.cdc.database.password=${EOS_CDC_DB_PASSWORD:AVNS_9sjHmMx190F4OXlcZbQ}
eos.cdc.database.name=eos_v1

# EOS Table Configuration (configure based on EOS database schema)
eos.cdc.database.include.list=eos_v1
eos.cdc.table.include.list=eos_v1.employee_details,eos_v1.employee_exit,eos_v1.offer_letter_details

# EOS Storage Configuration (independent from PMS)
eos.cdc.base.directory=data/debezium
eos.cdc.server.name=eos_mysql
eos.cdc.topic.prefix=eos
eos.cdc.connector.name=eos-cdc

# CDC Snapshot Mode Configuration - ENTERPRISE SNAPSHOT + INCREMENTAL STRATEGY
# Options: initial (snapshot on first start, then incremental), never (no snapshot), when_needed (snapshot if no offsets)
cdc.snapshot.mode=when_needed
eos.cdc.snapshot.mode=when_needed

# CDC SSL Configuration - REQUIRED for Aiven MySQL (plaintext connections are rejected)
cdc.database.ssl.mode=required
eos.cdc.database.ssl.mode=required

# CDC Freshness Validation Configuration
cdc.freshness.enabled=true
cdc.freshness.default-threshold-minutes=60
cdc.freshness.timezone=UTC