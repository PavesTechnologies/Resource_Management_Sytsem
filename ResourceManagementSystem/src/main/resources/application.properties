# Application Configuration
spring.application.name=ResourceManagementSystem

# Database Configuration
spring.datasource.url=jdbc:mysql://paves-intranet-demo.czsgackimf7p.ap-south-1.rds.amazonaws.com:3306/rms
spring.datasource.username=admin_paves
spring.datasource.password=${RMS_DB_PASSWORD:PavesAdmin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

# Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://13.204.95.26:8000
spring.security.user.name=admin
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin12345}

# Swagger Configuration
springdoc.swagger-ui.operations-sorter=alpha

# External API Configuration
external.auth.url=http://13.204.95.26:8000/auth/login
external.auth.email=rangaswamy.dama@pavestechnologies.com
external.auth.password=${EXTERNAL_AUTH_PASSWORD:Paves@123}

# External API Base URLs
external.api.holiday.base-url=http://13.204.95.26:9999
external.api.leave.base-url=http://13.204.95.26:9999

# External API Endpoints
external.api.holiday.year-endpoint=/api/holidays/year/{year}
external.api.leave.year-endpoint=/api/leave-requests/approved/{year}
external.api.leave.employee-endpoint=/api/leave-requests/approved/{employeeId}/{year}

# Token Configuration
external.token.cache.minutes=50
external.token.refresh.buffer.minutes=10

# Redis Configuration
spring.data.redis.host=13.204.95.26
spring.data.redis.port=6379
spring.data.redis.password=Paves@123
spring.data.redis.username=default
spring.data.redis.database=1
spring.data.redis.timeout=2000
spring.data.redis.connect-timeout=2000

# Cache Configuration
spring.cache.type=redis

# Exclude JPA repositories from Redis configuration
spring.data.redis.repositories.enabled=false

# CDC (Change Data Capture) Configuration - PMS Database
# Essential properties that need to change when PMS database changes
cdc.enabled=${CDC_ENABLED:false}

# Database Connection (change based on database type)
cdc.database.hostname=paves-intranet-demo.czsgackimf7p.ap-south-1.rds.amazonaws.com
cdc.database.port=3306
cdc.database.user=admin_paves
cdc.database.password=${PMS_CDC_DB_PASSWORD:PavesAdmin}
cdc.database.name=pms

# Table Configuration (may vary by database type)
cdc.database.include.list=pms
cdc.table.include.list=pms.projects

# CDC Storage Configuration
cdc.base.directory=${CDC_BASE_DIR:C:/rms/cdc-data}
cdc.server.name=pms_mysql
cdc.topic.prefix=pms

# EOS CDC Configuration - Independent from PMS CDC
# EOS Database Connection
eos.cdc.database.hostname=paves-intranet-demo.czsgackimf7p.ap-south-1.rds.amazonaws.com
eos.cdc.database.port=3306
eos.cdc.database.user=admin_paves
eos.cdc.database.password=${EOS_CDC_DB_PASSWORD:PavesAdmin}
eos.cdc.database.name=eos

# EOS Table Configuration (configure based on EOS database schema)
eos.cdc.database.include.list=eos
eos.cdc.table.include.list=eos.employee_details,eos.employee_exit,eos.offer_letter_details

# EOS Storage Configuration (independent from PMS)
eos.cdc.server.name=eos_mysql
eos.cdc.topic.prefix=eos
eos.cdc.connector.name=eos-cdc

# CDC Snapshot Mode Configuration - ENTERPRISE SNAPSHOT + INCREMENTAL STRATEGY
# Options: initial (snapshot on first start, then incremental), never (no snapshot), when_needed (snapshot if no offsets)
cdc.snapshot.mode=when_needed
eos.cdc.snapshot.mode=when_needed

# Lifecycle orchestration configuration
cdc.offer.waiting.max-days=45
cdc.offer.completed.reconciliation.max-minutes=60

# Debezium/Kafka Connect infrastructure noise reduction
logging.level.io.debezium=WARN
logging.level.org.apache.kafka.connect=WARN
spring.jpa.show-sql=false

# Suppress Redis unavailability noise when Redis is not running locally
logging.level.com.cdc.throttling.ReplayThrottlingService=ERROR
